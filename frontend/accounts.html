<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Teach — Accounts</title>
    <meta name="description" content="Issue credentials, reset passwords, deactivate accounts." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body data-page="accounts">
    <div class="app-shell" id="appShell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" id="sidebarLogo" src="./assets/logo.svg" alt="Teach logo" />
          <div class="brand-text">
            <strong id="sidebarSchool">Teach</strong>
            <span>Super admin</span>
          </div>
        </div>
        <nav class="side-nav" aria-label="Main"></nav>
        <div class="side-foot">
          <p class="principle">&ldquo;Schools, accounts and content review, each in their own place.&rdquo;</p>
        </div>
      </aside>

      <main class="main" id="main">
        <header class="topbar">
          <div class="topbar-id">
            <img class="topbar-logo" id="topLogo" src="./assets/logo.svg" alt="Teach logo" />
            <div class="topbar-copy">
              <p class="greeting" id="greeting">Good morning</p>
              <p class="subtle" id="schoolLine">Super admin console</p>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" id="modeToggle" aria-label="Toggle light or dark mode" title="Light / dark mode">
              <span class="ico" data-ico="mode"></span>
            </button>
          </div>
        </header>

        <section class="page is-active" data-page="accounts">
          <div class="card">
            <div class="card-head">
              <h2>Accounts</h2>
              <button class="primary-btn" id="newUserBtn">+ Issue credentials</button>
            </div>
            <table class="data-table">
              <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>School</th><th>Status</th><th></th></tr></thead>
              <tbody id="usersBody"><tr class="empty-row"><td colspan="6">Loading…</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>

      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head">
          <h2 id="sheetTitle">Issue credentials</h2>
          <button class="icon-btn" id="sheetClose" aria-label="Close">&#10005;</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/accounts.js"></script>
  </body>
</html>
