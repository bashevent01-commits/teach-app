<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.onrender.com https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KNOW - Advanced settings</title>
    <meta name="description" content="Account and appearance." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body data-page="advanced">
    <div class="app-shell" id="appShell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" id="sidebarLogo" src="./assets/logo.svg" alt="Institution logo" />
          <div class="brand-text">
            <strong id="sidebarSchool">KNOW</strong>
            <span>Accountability</span>
          </div>
        </div>
        <nav class="side-nav" aria-label="Main"></nav>
        <div class="side-foot">
          <p class="principle">&ldquo;Record money once, then let KNOW organize it everywhere else.&rdquo;</p>
        </div>
      </aside>

      <main class="main" id="main">
        <header class="topbar">
          <div class="topbar-id">
            <img class="topbar-logo" id="topLogo" src="./assets/logo.svg" alt="Institution logo" />

              <p class="greeting" id="greeting">Good morning</p>

          </div>

            <button class="icon-btn" id="modeToggle" aria-label="Toggle light or dark mode" title="Light / dark mode">
              <span class="ico" data-ico="mode"></span>
            </button>
          </div>
        </header>

        <section class="page is-active" data-page="advanced">
          <div class="card">
            <div class="card-head"><h2>Advanced settings</h2></div>
            <p class="subtle">The tools you use less often.</p>
            <div class="adv-links">
              <a class="ghost-btn" href="books.html">Books</a>
              <a class="ghost-btn" href="audit.html">Audits</a>
            </div>
          </div>
        </section>
      </main>

      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/password-rules.js"></script>
